<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTaskManager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
    <h1>iTaskManager</h1>
    <form id="form-tarefa">
        <div class="titulo-tarefa">
            <p><label for="titulo">Tarefa: </label>
                <input type="text" placeholder="Digite uma nova tarefa..." id="titulo" required></p>
        </div> <!--titulo-tarefa-->

        <div class="descricao-tarefa">
           <p><label for="descricao">Descrição: </label>
                <textarea id="descricao"></textarea> </p>
        </div> <!--descricao-tarefa-->

        <button id="adicionar" type="submit">Adicionar</button>
    </form> <!--form-tarefa-->

    <ul id="tarefas_lista"></ul>
   
    </main>
    
    <script src="app.js" defer></script>
</body>
</html>
